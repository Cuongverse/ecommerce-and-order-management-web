$kind: http-request
url: "{{base_url}}/api/ratings/create"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "productId": "{{product_id}}",
      "rating": 4.5
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK or 201 Created", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      pm.test("Response has rating value", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("rating");
          pm.expect(jsonData.rating).to.be.a("number");
      });
    language: text/javascript
order: 1000
