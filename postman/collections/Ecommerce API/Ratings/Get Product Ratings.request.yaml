$kind: http-request
url: "{{base_url}}/api/ratings/product/:productId"
method: GET
pathVariables:
  - key: productId
    value: "{{product_id}}"
    description: ID of the product to get ratings for
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response is an array", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.be.an("array");
      });
    language: text/javascript
order: 2000
