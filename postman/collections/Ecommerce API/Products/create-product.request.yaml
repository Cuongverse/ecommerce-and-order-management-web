$kind: http-request
name: Create Product
auth:
  type: inherit
  credentials:
    id: folder-D5F1CE2497ec4BBCF8B28BDF-bearer
order: 3000
method: POST
url: "{{base_url}}/api/admin/products"
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Steam giftcard",
      "description": "A 100$ giftcard",
      "price": 500000,
      "discountedPrice": 400000,
      "discountPercent": 20,
      "quantity": 150,
      "brand": "UnofficialSteamAccount",
      "color": "None",
      "imageUrl": "https://example.com/images/tshirt.jpg",
      "sizes": [
        { "name": "S", "quantity": 30 },
        { "name": "M", "quantity": 40 },
        { "name": "L", "quantity": 30 }
      ],
      "topLevelCategory": "Men",
      "secondLevelCategory": "Clothing",
      "thirdLevelCategory": "T-Shirts"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 201 Created or 200 OK", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      pm.test("Response has product id", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("id");
      });

      pm.test("Response has title", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("title");
      });

      // Capture product id
      var jsonData = pm.response.json();
      if (jsonData && jsonData.id) {
          pm.collectionVariables.set("product_id", String(jsonData.id));
          pm.environment.set("product_id", String(jsonData.id));
      }
    language: text/javascript
