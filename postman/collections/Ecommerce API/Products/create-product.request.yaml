$kind: http-request
name: 'Create Product'
order: 3000
method: POST
url: '{{base_url}}/api/admin/products'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Sample T-Shirt",
      "description": "A comfortable cotton t-shirt",
      "price": 500000,
      "discountedPrice": 450000,
      "discountPercent": 10,
      "quantity": 100,
      "brand": "SampleBrand",
      "color": "Blue",
      "imageUrl": "https://example.com/images/tshirt.jpg",
      "sizes": [
        { "name": "S", "quantity": 30 },
        { "name": "M", "quantity": 40 },
        { "name": "L", "quantity": 30 }
      ],
      "category": {
        "name": "T-Shirts",
        "level": 2
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 201 Created or 200 OK", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      pm.test("Response has product id", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("id");
      });

      pm.test("Response has title", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("title");
      });

      // Capture product id
      var jsonData = pm.response.json();
      if (jsonData && jsonData.id) {
          pm.collectionVariables.set("product_id", String(jsonData.id));
          pm.environment.set("product_id", String(jsonData.id));
      }
