$kind: http-request
name: 'Delete Product'
order: 5000
method: DELETE
url: '{{base_url}}/api/admin/products/:productId'
pathVariables:
  - key: productId
    value: '{{product_id}}'
    description: 'ID of the product to delete'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK or 204 No Content", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 204]);
      });
