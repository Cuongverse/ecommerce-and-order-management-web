$kind: http-request
name: 'Update Product'
order: 4000
method: PUT
url: '{{base_url}}/api/admin/products/:productId'
pathVariables:
  - key: productId
    value: '{{product_id}}'
    description: 'ID of the product to update'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Updated T-Shirt",
      "description": "Updated description",
      "price": 480000,
      "discountedPrice": 430000,
      "discountPercent": 10,
      "quantity": 80,
      "brand": "SampleBrand",
      "color": "Red"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response has product id", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("id");
      });
