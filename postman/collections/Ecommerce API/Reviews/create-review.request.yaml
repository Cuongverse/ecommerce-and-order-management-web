$kind: http-request
name: 'Create Review'
order: 1000
method: POST
url: '{{base_url}}/api/reviews/create'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "productId": "{{product_id}}",
      "review": "Great product, highly recommend!"
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test("Status is 200 OK or 201 Created", function () {
          pm.expect(pm.response.code).to.be.oneOf([200, 201]);
      });

      pm.test("Response has review text", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("review");
          pm.expect(jsonData.review).to.be.a("string");
      });

      pm.test("Response has id", function () {
          var jsonData = pm.response.json();
          pm.expect(jsonData).to.have.property("id");
      });
