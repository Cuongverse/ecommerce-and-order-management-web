version: '3.9'

services:
  mysql:
    image: mysql:8.0
    container_name: ecommerce-testdb
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: testdb
      MYSQL_USER: testdb
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-160422}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-160422}
    ports:
      - "3307:3306"
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_testdb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql_testdb_data:
