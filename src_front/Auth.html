<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in | GiftCard</title>
    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="auth.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

<main class="au-page">
    <div class="au-card">

        <!-- ================= LEFT: switches between the two modes ================= -->
        <section class="au-intro">
            <a href="site.html" class="au-logo"><img src="header_images/logo.png" alt="GiftCards"></a>

            <div id="au-intro-login">
                <h1>One account for all of our gift cards</h1>
                <p>First time here? Create your account to start shopping.</p>
                <button type="button" class="au-switch" data-mode="signup">Sign up</button>
            </div>

            <div id="au-intro-signup" hidden>
                <h1>Welcome back</h1>
                <p>Already have an account? Log in to see your cart and orders.</p>
                <button type="button" class="au-switch" data-mode="login">Log in</button>
            </div>
        </section>

        <!-- ================= RIGHT: the forms ================= -->
        <section class="au-form-panel">

            <!-- LOGIN -->
            <form id="login-form" novalidate>
                <h2>Log in</h2>
                <p class="au-sub">Log in with a social account</p>
                <div class="au-socials" data-socials></div>

                <div class="au-field">
                    <input type="email" id="login-email" placeholder="Email" autocomplete="email" required>
                </div>
                <div class="au-field">
                    <input type="password" id="login-password" placeholder="Password" autocomplete="current-password" required>
                    <button type="button" class="au-eye" data-eye="login-password" aria-label="Show password" data-eye-icon></button>
                    <button type="submit" class="au-go" aria-label="Log in">&#10140;</button>
                </div>
                <p class="au-error" id="login-error" role="alert"></p>
                <a href="" class="au-link">Forgot your password?</a>
            </form>

            <!-- SIGN UP -->
            <form id="signup-form" novalidate hidden>
                <h2>Sign up</h2>
                <p class="au-sub">Sign up with a social account</p>
                <div class="au-socials" data-socials></div>

                <div class="au-names">
                    <div class="au-field"><input type="text" id="signup-first" placeholder="First name" autocomplete="given-name" required></div>
                    <div class="au-field"><input type="text" id="signup-last" placeholder="Last name" autocomplete="family-name" required></div>
                </div>
                <div class="au-field">
                    <input type="email" id="signup-email" placeholder="Email" autocomplete="email" required>
                </div>
                <div class="au-field">
                    <input type="password" id="signup-password" placeholder="Password" autocomplete="new-password" required>
                    <button type="button" class="au-eye" data-eye="signup-password" aria-label="Show password" data-eye-icon></button>
                    <button type="submit" class="au-go" aria-label="Create account">&#10140;</button>
                </div>
                <p class="au-error" id="signup-error" role="alert"></p>
            </form>

        </section>
    </div>

    <a href="site.html" class="au-back">&#10094; Back to store</a>
</main>

<script src="api.js"></script>
<script>
/* ---------- social icons: the same ones as the footer (decorative for now) ---------- */
const SOCIAL_ICONS = `
    <a href="#" aria-label="Facebook">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg>
    </a>
    <a href="#" aria-label="Instagram">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" y1="6.5" x2="17.51" y2="6.5"/></svg>
    </a>
    <a href="#" aria-label="YouTube">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"/><polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"/></svg>
    </a>
    <a href="#" aria-label="Twitter">
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M12.6.75h2.454l-5.36 6.142L16 15.25h-4.937l-3.867-5.07-4.425 5.07H.316l5.733-6.57L0 .75h5.063l3.495 4.633L12.601.75Zm-.86 13.028h1.36L4.323 2.145H2.865z"/></svg>
    </a>
    <a href="#" aria-label="Zalo">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-5 0-9 3.4-9 7.8 0 2.4 1.2 4.5 3.1 6L5.5 21l4-2.2c.8.2 1.6.3 2.5.3 5 0 9-3.4 9-7.8S17 3 12 3z"/><path d="M8.5 8.5h7l-7 5.5h7"/></svg>
    </a>`;
document.querySelectorAll("[data-socials]").forEach(box => { box.innerHTML = SOCIAL_ICONS; });
document.querySelectorAll("[data-socials] a").forEach(a => a.addEventListener("click", e => e.preventDefault()));

/* ---------- eye icon: show / hide password ---------- */
const EYE = `<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>`;
document.querySelectorAll("[data-eye-icon]").forEach(btn => {
    btn.innerHTML = EYE;
    btn.addEventListener("click", () => {
        const input = document.getElementById(btn.dataset.eye);
        const show = input.type === "password";
        input.type = show ? "text" : "password";
        btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
        btn.style.opacity = show ? "0.6" : "1";
    });
});

/* ---------- switch between log in and sign up ---------- */
function setMode(mode) {
    const signup = mode === "signup";
    document.getElementById("login-form").hidden = signup;
    document.getElementById("signup-form").hidden = !signup;
    document.getElementById("au-intro-login").hidden = signup;
    document.getElementById("au-intro-signup").hidden = !signup;
    document.title = (signup ? "Sign up" : "Log in") + " | GiftCard";
}
document.querySelectorAll(".au-switch").forEach(btn =>
    btn.addEventListener("click", () => setMode(btn.dataset.mode)));
if (location.hash === "#signup") setMode("signup");

/* ---------- send the form to the backend ---------- */
function afterAuth() {
    // go back to where the visitor came from, else the home page
    const next = new URLSearchParams(location.search).get("next");
    let target = "site.html";
    try {
        const url = new URL(next, location.href);
        if (next && url.origin === location.origin) target = url.href;   // never jump to another website
    } catch {}
    location.href = target;
}

async function submitAuth(form, path, payload, errorBox) {
    const button = form.querySelector(".au-go");
    errorBox.textContent = "";

    if (Object.values(payload).some(v => !v.trim())) {
        errorBox.textContent = "Please fill in every field.";
        return;
    }

    button.disabled = true;
    try {
        const data = await apiFetch(path, { method: "POST", body: payload });
        if (!data || !data.jwt) throw new Error("The server did not return a login token.");
        Auth.setToken(data.jwt);
        afterAuth();
    } catch (err) {
        errorBox.textContent = err.message;
        button.disabled = false;
    }
}

document.getElementById("login-form").addEventListener("submit", e => {
    e.preventDefault();
    submitAuth(e.target, "/auth/login", {
        email: document.getElementById("login-email").value,
        password: document.getElementById("login-password").value,
    }, document.getElementById("login-error"));
});

document.getElementById("signup-form").addEventListener("submit", e => {
    e.preventDefault();
    submitAuth(e.target, "/auth/signup", {
        firstName: document.getElementById("signup-first").value,
        lastName: document.getElementById("signup-last").value,
        email: document.getElementById("signup-email").value,
        password: document.getElementById("signup-password").value,
    }, document.getElementById("signup-error"));
});

// already logged in? no reason to be here
if (Auth.isLoggedIn()) afterAuth();
</script>
</body>
</html>
