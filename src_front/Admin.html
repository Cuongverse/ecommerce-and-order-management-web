<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | GiftCard</title>
    <link rel="stylesheet" href="site.css">
    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="orders.css">
    <link rel="stylesheet" href="admin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
<body>

<!-- ================= header (same as site.html) ================= -->
<div class="header">
    <div class="container">
        <div class="navbar">
            <div class="logo">
                <a href="site.html"><img src="header_images/logo.png" width="250px" alt="GiftCards"></a>
            </div>
            <nav>
                <ul>
                    <li><a href="site.html">Home</a></li>
                    <li><a href="site.html#featured">Gift Cards</a></li>
                    <li><a href="site.html#vouchers">Vouchers</a></li>
                    <li><a href="orders.html">My Orders</a></li>
                    <li><a href="admin.html">Admin</a></li>
                </ul>
            </nav>

            <div class="nav-actions">
                <div class="search-box">
                    <input type="text" placeholder="Search gift cards...">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="11" cy="11" r="7"/>
                        <line x1="16.5" y1="16.5" x2="21" y2="21"/>
                    </svg>
                </div>
                <button class="icon-btn" aria-label="Cart">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="9" cy="20" r="1.5"/>
                        <circle cx="18" cy="20" r="1.5"/>
                        <path d="M2 3h3l2.5 12h11l2-8H6"/>
                    </svg>
                </button>
                <button class="icon-btn" aria-label="Balance">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/>
                        <path d="M14.5 9.5c-.5-1-1.5-1.5-2.5-1.5-1.4 0-2.5.8-2.5 2s1 1.8 2.5 2 2.5.8 2.5 2-1.1 2-2.5 2c-1 0-2-.5-2.5-1.5M12 6v2M12 16v2"/>
                    </svg>
                </button>
                <button class="avatar-btn" aria-label="Profile">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                        <circle cx="12" cy="8" r="4"/>
                        <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"/>
                    </svg>
                </button>
            </div>
        </div>
    </div>
</div>

<!-- ================= admin ================= -->
<main class="ct-wrap">
    <div class="ct-head">
        <h1>Admin</h1>
        <span id="ad-note"></span>
    </div>

    <!-- shown while loading, or when the account has no admin access -->
    <div class="ct-state" id="ct-state"><p>Loading...</p></div>

    <div id="ad-app" hidden>
        <div class="ad-tabs">
            <button type="button" class="ad-tab active" data-tab="orders">Orders</button>
            <button type="button" class="ad-tab" data-tab="products">Products</button>
        </div>
        <p class="ct-error" id="ad-msg" role="alert"></p>

        <!-- ===== orders tab ===== -->
        <section class="ct-card ad-panel" id="panel-orders">
            <div class="ad-toolbar"><div class="ad-chips" id="ad-chips"></div></div>
            <div class="ad-table-wrap">
                <table class="ad-table">
                    <thead><tr><th>Order</th><th>Customer</th><th>Date</th><th>Items</th><th>Total</th><th>Status</th><th>Actions</th></tr></thead>
                    <tbody id="ad-orders"></tbody>
                </table>
            </div>
        </section>

        <!-- ===== products tab ===== -->
        <section class="ct-card ad-panel" id="panel-products" hidden>
            <div class="ad-toolbar">
                <span class="ad-hint">All products in the store</span>
                <button type="button" class="ad-btn big" id="ad-new">+ New product</button>
            </div>
            <div class="ad-table-wrap">
                <table class="ad-table">
                    <thead><tr><th></th><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Actions</th></tr></thead>
                    <tbody id="ad-products"></tbody>
                </table>
            </div>
        </section>
    </div>
</main>

<!-- ===== product dialog (create + edit) ===== -->
<dialog class="ad-modal" id="ad-dialog">
    <h3 id="ad-dialog-title">New product</h3>
    <form class="ct-form" id="ad-form" novalidate>
        <label class="full">Title <input name="title" required></label>
        <label class="full">Description <textarea name="description"></textarea></label>
        <label class="full">Image (file name in product_images/, or a full link) <input name="imageUrl" placeholder="netflix.png"></label>
        <label>Brand <input name="brand"></label>
        <label>Color <input name="color"></label>
        <label>Price <input name="price" type="number" min="0" step="1" required></label>
        <label>Price after discount <input name="discountedPrice" type="number" min="0" step="1"></label>
        <label>Discount % <input name="discountedPercent" type="number" min="0" max="100" step="1"></label>
        <label>Stock quantity <input name="quantity" type="number" min="0" step="1"></label>
        <label class="full">Options / sizes <input name="sizes" placeholder="S:30, M:40, L:30">
            <span class="ad-hint">Format name:stock, separated by commas. Leave empty if the product has no options.</span></label>
        <label data-create-only>Category (top level) <input name="topLevelCategory" placeholder="Gaming"></label>
        <label data-create-only>Category (second level) <input name="secondLevelCategory" placeholder="Steam"></label>
        <label class="full" data-create-only>Category (third level) <input name="thirdLevelCategory" placeholder="Wallet cards"></label>
    </form>
    <p class="ct-error" id="ad-form-msg" role="alert"></p>
    <div class="ad-actions">
        <button type="button" class="ad-btn" id="ad-cancel">Cancel</button>
        <button type="submit" form="ad-form" class="ad-btn big" id="ad-save">Save</button>
    </div>
</dialog>

<footer class="footer ct-footer">
    <div class="container">
        <div class="footer-bottom">
            <p>&copy; 2026 GiftCards. All rights reserved.</p>
        </div>
    </div>
</footer>

<script src="api.js"></script>
<script>
const $ = sel => document.querySelector(sel);
const money = n => new Intl.NumberFormat('en-US', { style: 'currency', currency: 'USD' }).format(n);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
));
const imageFor = url => {
    if (!url) return 'product_images/testing.png';
    if (/^(https?:|data:|\/)/.test(url)) return url;
    return url.startsWith('product_images/') ? url : 'product_images/' + url;
};

/* ---------- statuses (same rules as orders.html) ---------- */
const STATUSES = ['PENDING', 'CONFIRMED', 'SHIPPED', 'DELIVERED', 'CANCELLED'];
const LABEL = { PENDING: 'Pending', CONFIRMED: 'Confirmed', SHIPPED: 'Shipped', DELIVERED: 'Delivered', CANCELLED: 'Cancelled' };
const norm = s => {
    const u = String(s || '').toUpperCase();
    return (u === 'PLACED' || u === 'CREATED') ? 'PENDING' : u;
};
const badge = s => `<span class="od-badge ${norm(s)}">${esc(LABEL[norm(s)] || s || 'Unknown')}</span>`;
const dateOf = v => v ? (Array.isArray(v) ? new Date(v[0], v[1] - 1, v[2], v[3] || 0, v[4] || 0) : new Date(v)) : null;
const fmt = v => {
    const d = dateOf(v);
    return d && !isNaN(d) ? d.toLocaleString('en-US', { dateStyle: 'medium', timeStyle: 'short' }) : '';
};
const orderTotal = o => o.totalDiscountedPrice > 0 ? o.totalDiscountedPrice : (o.totalPrice || 0);

let orders = [];
let products = [];
let filter = 'ALL';
let editing = null;            // the product being edited, or null when creating
let productsLoaded = false;

function showState(html) {
    $('#ct-state').innerHTML = html;
    $('#ct-state').hidden = false;
    $('#ad-app').hidden = true;
}
function say(msg) { $('#ad-msg').textContent = msg || ''; }

// backend answers 403 when the account is not an admin
function handleError(err) {
    if (err.status === 403) {
        showState(`<p>This page needs an admin account.</p>
                   <a class="ct-btn primary" href="auth.html?next=${encodeURIComponent(location.href)}" id="relogin">Log in as admin</a>`);
        $('#relogin').addEventListener('click', () => Auth.clear());
    } else {
        say(err.message);
    }
}

/* =====================================================
   ORDERS TAB
   GET    /api/admin/orders
   PUT    /api/admin/orders/{id}/confirmed | ship | deliver | cancel
   DELETE /api/admin/orders/{id}/delete
   ===================================================== */
// which buttons make sense for which status (the backend does not check this)
const CAN = {
    confirm: s => s === 'PENDING',
    ship:    s => s === 'CONFIRMED',
    deliver: s => s === 'SHIPPED',
    cancel:  s => s !== 'DELIVERED' && s !== 'CANCELLED',
    delete:  () => true,
};
const ACTION = {
    confirm: ['PUT', 'confirmed'],
    ship:    ['PUT', 'ship'],
    deliver: ['PUT', 'deliver'],
    cancel:  ['PUT', 'cancel'],
    delete:  ['DELETE', 'delete'],
};

async function loadOrders() {
    orders = await apiFetch('/api/admin/orders');
    orders.sort((a, b) => b.id - a.id);
    renderOrders();
}

function renderOrders() {
    const counts = { ALL: orders.length };
    STATUSES.forEach(s => counts[s] = orders.filter(o => norm(o.orderStatus) === s).length);

    $('#ad-chips').innerHTML = ['ALL', ...STATUSES].map(s =>
        `<button type="button" class="ad-chip${s === filter ? ' active' : ''}" data-filter="${s}">${s === 'ALL' ? 'All' : LABEL[s]} (${counts[s]})</button>`
    ).join('');

    const list = filter === 'ALL' ? orders : orders.filter(o => norm(o.orderStatus) === filter);

    $('#ad-orders').innerHTML = list.length ? list.map(o => {
        const s = norm(o.orderStatus);
        const u = o.user || {};
        const btn = (act, text, cls) =>
            `<button type="button" class="ad-btn ${cls || ''}" data-act="${act}" data-id="${o.id}" ${CAN[act](s) ? '' : 'disabled'}>${text}</button>`;
        return `
        <tr>
            <td><b>#${o.id}</b></td>
            <td>${esc(((u.firstName || '') + ' ' + (u.lastName || '')).trim() || '—')}<small>${esc(u.email || '')}</small></td>
            <td>${esc(fmt(o.orderDate || o.createdAt))}</td>
            <td>${o.totalItem || (o.orderItems || []).length}</td>
            <td class="ad-price">${money(orderTotal(o))}</td>
            <td>${badge(o.orderStatus)}</td>
            <td><div class="ad-actions">
                ${btn('confirm', 'Confirm', 'ok')}${btn('ship', 'Ship', 'ok')}${btn('deliver', 'Delivered', 'ok')}
                ${btn('cancel', 'Cancel', 'danger')}${btn('delete', 'Delete', 'danger')}
            </div></td>
        </tr>`;
    }).join('') : `<tr><td colspan="7" class="ad-hint">No orders here.</td></tr>`;
}

$('#ad-chips').addEventListener('click', e => {
    const chip = e.target.closest('[data-filter]');
    if (chip) { filter = chip.dataset.filter; renderOrders(); }
});

$('#ad-orders').addEventListener('click', async e => {
    const btn = e.target.closest('button[data-act]');
    if (!btn || btn.disabled) return;
    const act = btn.dataset.act;
    if ((act === 'cancel' || act === 'delete') &&
        !confirm(`${act === 'cancel' ? 'Cancel' : 'Permanently delete'} order #${btn.dataset.id}?`)) return;

    say('');
    btn.disabled = true;
    try {
        const [method, path] = ACTION[act];
        await apiFetch(`/api/admin/orders/${btn.dataset.id}/${path}`, { method });
        await loadOrders();
    } catch (err) {
        handleError(err);
        renderOrders();
    }
});

/* =====================================================
   PRODUCTS TAB
   GET    /api/admin/products/all
   POST   /api/admin/products
   PUT    /api/admin/products/{id}/update
   DELETE /api/admin/products/{id}/delete
   ===================================================== */
async function loadProducts() {
    products = await apiFetch('/api/admin/products/all');
    products.sort((a, b) => b.id - a.id);
    productsLoaded = true;
    renderProducts();
}

function renderProducts() {
    $('#ad-products').innerHTML = products.length ? products.map(p => `
        <tr>
            <td><img class="ad-thumb" src="${esc(imageFor(p.imageUrl))}" alt="" onerror="this.onerror=null;this.src='product_images/testing.png'"></td>
            <td><b>${esc(p.title)}</b><small>${esc(p.brand || '')}</small></td>
            <td>${esc((p.category && p.category.name) || '—')}</td>
            <td class="ad-price">${money(p.discountedPrice > 0 ? p.discountedPrice : p.price)}</td>
            <td>${p.quantity}</td>
            <td><div class="ad-actions">
                <button type="button" class="ad-btn ok" data-act="edit" data-id="${p.id}">Edit</button>
                <button type="button" class="ad-btn danger" data-act="del" data-id="${p.id}">Delete</button>
            </div></td>
        </tr>`).join('') : `<tr><td colspan="6" class="ad-hint">No products yet.</td></tr>`;
}

const form = $('#ad-form');
const dialog = $('#ad-dialog');

function openDialog(product) {
    editing = product;
    form.reset();
    $('#ad-form-msg').textContent = '';
    $('#ad-dialog-title').textContent = product ? 'Edit product' : 'New product';
    form.querySelectorAll('[data-create-only]').forEach(el => el.hidden = !!product);   // categories only when creating

    if (product) {
        form.title.value = product.title || '';
        form.description.value = product.description || '';
        form.imageUrl.value = product.imageUrl || '';
        form.brand.value = product.brand || '';
        form.color.value = product.color || '';
        form.price.value = product.price;
        form.discountedPrice.value = product.discountedPrice;
        form.discountedPercent.value = product.discountedPercent;
        form.quantity.value = product.quantity;
        form.sizes.value = Array.from(product.sizes || []).map(s => `${s.name}:${s.quantity}`).join(', ');
    }
    dialog.showModal();
}

// "S:30, M:40" -> [{name:"S", quantity:30}, {name:"M", quantity:40}]
function parseSizes(text) {
    return text.split(',').map(part => part.trim()).filter(Boolean).map(part => {
        const [name, qty] = part.split(':');
        return { name: name.trim(), quantity: Number(qty) || 0 };
    });
}

form.addEventListener('submit', async e => {
    e.preventDefault();
    const f = Object.fromEntries(new FormData(form));
    const msg = $('#ad-form-msg');
    msg.textContent = '';

    const price = Number(f.price);
    if (!f.title.trim() || !(price > 0)) {
        msg.textContent = 'A title and a price above 0 are required.';
        return;
    }
    const discountedPrice = f.discountedPrice === '' ? price : Number(f.discountedPrice);
    const discountedPercent = f.discountedPercent === ''
        ? Math.round((1 - discountedPrice / price) * 100)
        : Number(f.discountedPercent);

    const common = {
        title: f.title.trim(),
        description: f.description.trim(),
        imageUrl: f.imageUrl.trim(),
        brand: f.brand.trim(),
        color: f.color.trim(),
        price,
        discountedPrice,
        discountedPercent,
        quantity: Number(f.quantity) || 0,
    };
    const sizes = parseSizes(f.sizes);

    $('#ad-save').disabled = true;
    try {
        if (editing) {
            // the update replaces every number we send, so numRatings is sent back unchanged
            await apiFetch(`/api/admin/products/${editing.id}/update`, {
                method: 'PUT',
                body: { ...common, sizes, numRatings: editing.numRatings || 0 },
            });
        } else {
            if (!f.topLevelCategory.trim() || !f.secondLevelCategory.trim() || !f.thirdLevelCategory.trim()) {
                msg.textContent = 'Please fill in all three category levels.';
                $('#ad-save').disabled = false;
                return;
            }
            await apiFetch('/api/admin/products', {
                method: 'POST',
                body: {
                    ...common,
                    size: sizes,                                   // (sic) the create request calls it "size"
                    topLevelCategory: f.topLevelCategory.trim(),
                    secondLevelCategory: f.secondLevelCategory.trim(),
                    thirdLevelCategory: f.thirdLevelCategory.trim(),
                },
            });
        }
        dialog.close();
        await loadProducts();
    } catch (err) {
        msg.textContent = err.message;
    }
    $('#ad-save').disabled = false;
});

$('#ad-new').addEventListener('click', () => openDialog(null));
$('#ad-cancel').addEventListener('click', () => dialog.close());

$('#ad-products').addEventListener('click', async e => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const product = products.find(p => String(p.id) === btn.dataset.id);
    if (!product) return;

    if (btn.dataset.act === 'edit') { openDialog(product); return; }

    if (!confirm(`Delete "${product.title}"?`)) return;
    say('');
    try {
        await apiFetch(`/api/admin/products/${product.id}/delete`, { method: 'DELETE' });
        await loadProducts();
    } catch (err) {
        handleError(err);
    }
});

/* ---------- tabs ---------- */
document.querySelectorAll('.ad-tab').forEach(tab => tab.addEventListener('click', async () => {
    document.querySelectorAll('.ad-tab').forEach(t => t.classList.toggle('active', t === tab));
    $('#panel-orders').hidden = tab.dataset.tab !== 'orders';
    $('#panel-products').hidden = tab.dataset.tab !== 'products';
    say('');
    if (tab.dataset.tab === 'products' && !productsLoaded) {
        try { await loadProducts(); } catch (err) { handleError(err); }
    }
}));

/* ---------- start ---------- */
(async function init() {
    if (!Auth.isLoggedIn()) {
        location.href = 'auth.html?next=' + encodeURIComponent(location.href);
        return;
    }
    try {
        await loadOrders();
    } catch (err) {
        if (err.status === 403) { handleError(err); return; }
        showState(`<p class="ct-error">${esc(err.message)}</p>`);
        return;
    }
    $('#ct-state').hidden = true;
    $('#ad-app').hidden = false;
})();
</script>
</body>
</html>
